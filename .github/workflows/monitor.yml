name: cloud inventory monitor

# پایش ابری موجودی — حتی وقتی کامپیوتر شما خاموش است
# زمان‌بندی: هر ۱۵ دقیقه (به وقت UTC؛ برای تغییر، خط cron را ویرایش کنید)
# اجرای دستی: از تب Actions در گیت‌هاب با دکمه Run workflow

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inventory-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run monitor
        env:
          SNAPP_VENDOR_CODE: ${{ secrets.SNAPP_VENDOR_CODE }}
          RUBIKA_TOKEN: ${{ secrets.RUBIKA_TOKEN }}
          RUBIKA_CHAT: ${{ secrets.RUBIKA_CHAT }}
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          BALE_CHAT: ${{ secrets.BALE_CHAT }}
        run: python cloud-monitor/monitor.py

      - name: Commit data
        run: |
          git config user.name "inventory-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json data/history.json
          if git diff --cached --quiet; then
            echo "no data changes to commit"
          else
            git commit -m "monitor data update $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi
